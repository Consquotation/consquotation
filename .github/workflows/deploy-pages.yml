# Build, kiểm tra và deploy ConsQuotation lên GitHub Pages (ADR-0007).
# Yêu cầu: Settings › Pages › Source = "GitHub Actions" và biến repo CQ_PROD_URL.
name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CQ_PROD_URL: ${{ vars.CQ_PROD_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Kiểm tra biến CQ_PROD_URL
        run: |
          if [ -z "$CQ_PROD_URL" ]; then
            echo "::error::Chưa đặt biến repo CQ_PROD_URL (ví dụ https://<to-chuc>.github.io/consquotation/)."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run validate:prod

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
